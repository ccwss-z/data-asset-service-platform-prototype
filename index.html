  async function saveAttachment(file){
    const ref='ATT-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9);
    try{const db=await attachmentDb();await new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put({id:ref,name:file.name,type:file.type,blob:file});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close();return ref}
    catch(err){
      if(file.size>1024*1024)throw new Error('当前浏览器无法持久保存超过1MB的演示附件');
      const bytes=new Uint8Array(await file.arrayBuffer());let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.slice(i,i+8192));
      localStorage.setItem('xinghai_attachment_'+ref,JSON.stringify({name:file.name,type:file.type,data:btoa(binary)}));return ref;
    }
  }
  async function loadAttachment(ref){
    if(ref.startsWith('demo-'))return {demo:true};
    try{const db=await attachmentDb();const record=await new Promise((resolve,reject)=>{const tx=db.transaction('files','readonly'),req=tx.objectStore('files').get(ref);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});db.close();if(record)return record}catch{}
    const fallback=localStorage.getItem('xinghai_attachment_'+ref);if(!fallback)return null;
    const item=JSON.parse(fallback),binary=atob(item.data),bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));return {name:item.name,type:item.type,blob:new Blob([bytes],{type:item.type})};
  }
  async function attachEnterpriseFiles(f,enterprise){

    }
    return true;
  }
  function collectEnterprise(v,f,current={}){
    if(v.businessEnd<v.businessStart){toast('经营期限截止日期不能早于起始日期');return null}

    if(!legalId&&!current.legalId){toast('请填写法定代表人身份证号');return null}

      const oldCredit=company.credit,oldName=company.name;

      company.realNameStatus='approved';

  function certChangeForm(){const c=state.company||{},change=currentChange();if(c.realNameStatus!=='approved')return empty('请先完成企业实名认证');if(change?.certStatus==='pending')return `${head('','实名认证变更','当前变更申请正在审核。',navBtn('返回账号信息','profile'))}<div class="callout warning">申请 ${esc(change.id)} 待审核。审核前原认证信息继续有效。</div>`;

  function messages(){return `${head('NOTIFICATIONS','消息中心','认证、购买与授权状态变化在这里提醒。',button('全部标记已读','read-all'))}<section class="panel"><div class="panel-pad">${state.messages.map(m=>`<div class="message"><div class="message-mark">${m.read?'✓':'!'}</div><div style="flex:1"><div class="action-row" style="justify-content:space-between"><b>${esc(m.title)}</b>${!m.read?status('未读','info'):status('已读')}</div><p>${esc(m.body)}</p><small class="muted">${esc(m.time)}</small><div class="action-row" style="margin-top:7px">${!m.read?button('标记已读','read-message',`data-id="${m.id}"`,'small'):''}</div></div></div>`).join('')||empty('暂无消息','业务状态变化后会自动生成提醒。')}</div></section>`}

  function simulate({orderId,ip,fields,environment,scenario=null}){
    const o=ownedOrders().find(x=>x.id===orderId),p=product(o?.productId),req='REQ-'+Date.now().toString(36).toUpperCase();let reason='授权通过';const reqFields=String(fields||'').split(',').map(x=>x.trim()).filter(Boolean);const today=TODAY();
    if(!o||!p)reason='产品或订单不存在';
    else if(scenario===1||state.company?.certStatus!=='approved')reason='使用方主体认证未通过';
    else if(!['active'].includes(o.status))reason='调用授权未生效或已停用';
    else if(scenario===2||today<o.start||today>o.end)reason='协议未生效或已到期';
    else if(scenario===3||o.used>=o.limit)reason='授权调用次数已用尽';
    else if(scenario===4||!o.whitelist.includes(ip))reason='来源 IP 不在白名单';
    else if(scenario===5||!reqFields.length||reqFields.some(f=>!o.openFields.includes(f)||!p.dictionary.some(d=>d.id===f)))reason='请求包含未开放的数据字典项';
    const ok=reason==='授权通过';if(ok)o.used++;
    const payload=ok?{requestId:req,code:'SUCCESS',data:{openedDictionaryItems:reqFields,records:[{planId:'PLAN-DEMO-001',available:true}]},message:'仅展示已授权数据项'}:{requestId:req,code:'ACCESS_DENIED',message:reason,data:null};
    state.simResult={ok,reason,id:req,fields:reqFields.join('、'),payload};
    state.logs.unshift({id:req,time:now(),company:state.company?.name||'演示企业',product:p?.name||'未知产品',orderId:o?.id||'—',ip,environment,sdk:'JS SDK 1.0',fields:reqFields.join('、'),result:ok?'成功':'拒绝',reason,counted:ok,latency:ok?86:17});
    if(!ok)state.alerts.unshift({id:id('SEC',state.alerts),time:now(),level:reason.includes('未开放')?'高':'中',name:reason,detail:`${ip} · ${o?.id||'未知订单'} · ${req}`,status:'待处理'});

function ptCaptureProductForm(){
  const f=document.querySelector('form[data-form="pt-product"]');if(!f||!ptDraft)return;
  const v=Object.fromEntries(new FormData(f).entries());for(const key of ['name','category','tags','provider','description','usageRestriction','tableName','tableDescription'])if(v[key]!==undefined)ptDraft[key]=v[key];
  const previous=ptDraft.dataSchema||[];ptDraft.dataSchema=[...f.querySelectorAll('[data-schema-row]')].map(row=>{
    const read=key=>row.querySelector('[data-schema-key="'+key+'"]')?.value??'',name=read('name'),dbType=read('dbType');
    const old=previous[Number(row.dataset.index)];const item={name,label:read('label'),dbType,type:ptInternalType(dbType),length:read('length'),primaryKey:read('primaryKey')==='true',nullable:read('nullable')!=='false',dictionaryValues:read('dictionaryValues').split('|').map(x=>x.trim()).filter(Boolean),groupId:row.dataset.group||'1'};
    if(old?.name===name&&Object.hasOwn(old,'sample'))item.sample=old.sample;return item;
  });

function ptOrderDetail(){if(state.role==='customer')return ptPurchasedDetail();if(state.role!=='operator')return ptNotAllowed();const o=order(state.viewOrder);if(!o||!ptOperatesOrder(o))return ptNotAllowed();if(state.orderDetailSource==='agreements')return ptAgreementDetail(o);const p=product(o.productId),tab=state.ptOrderTab||'application';return `${head('','购买申请详情',`${esc(o.company)} · ${esc(p?.name||o.productId)}`,ptBtn('返回受理列表','back-orders'))}${panel('申请资料',`${ptTabs([['application','购买申请'],['product','产品信息'],['agreement','协议登记情况']],tab,'order-tab',o.id)}${tab==='product'?ptProductInfo(p):tab==='agreement'?o.agreementId?ptAuthorizationView(o):empty('尚未登记协议'):ptApplicationView(o)}`)}${o.status==='pending'?panel('受理处理',`<form data-form="pt-order-decision"><input type="hidden" name="orderId" value="${esc(o.id)}">${area('reason','受理意见','','required')}<div class="form-grid">${field('negotiatedAmount','线下商定费用（元，选填）',o.negotiatedAmount??'','number','min="0" step="0.01"')}${area('feeNote','费用说明',o.feeNote||'')}</div><div class="form-foot"><button class="btn primary" name="decision" value="accept">受理申请</button><button class="btn danger" name="decision" value="reject">驳回申请</button></div></form>`,'','account-section'):['contract','authorization','active','suspended'].includes(o.status)?panel('线下协议',`<p class="muted">线下签署协议后，上传 PDF 并手工录入产品、有效期、使用次数等关键指标。</p>${ptBtn(o.agreementId?'修改协议登记':'上传并登记协议','edit-agreement',o.id,'primary')}`,'','account-section'):''}`}
function ptAgreementForm(){if(state.role!=='operator')return ptNotAllowed();const o=order(state.viewOrder);if(!o||!ptOperatesOrder(o))return ptNotAllowed();if(o.identityChangeHold)return empty('主体已变更','原协议不能继续使用，请重新申请购买。');const p=product(o.productId);return `${head('','协议登记',`${esc(o.company)} · ${esc(p?.name||o.productId)}`,ptBtn('返回详情','back-agreement-form'))}${panel('纸质协议及关键指标',`<form data-form="pt-agreement"><input type="hidden" name="orderId" value="${esc(o.id)}"><div class="form-section">关联产品与主体</div><dl class="detail-list"><dt>购买申请</dt><dd class="mono">${esc(o.id)}</dd><dt>使用方</dt><dd>${esc(o.company)}</dd><dt>关联产品</dt><dd>${esc(p?.name||o.productId)}（${esc(o.productId)}）</dd></dl><div class="form-section">协议文件</div><div class="form-grid">${field('agreementId','协议编号',o.agreementId||'','text','required')}${field('signDate','签署日期',o.signDate||TODAY(),'date','required')}<div class="field span2"><label>已签署协议 PDF</label><input type="file" name="agreementFile" accept=".pdf,application/pdf">${button('预览已选 PDF','preview-selected-file','type="button" data-field="agreementFile"','small')}<small>支持 PDF，单个不超过 10MB。已保存：${attachmentValue(o,'agreementFile','agreementRef')}</small></div>${area('contractRemark','协议备注',o.contractRemark||'')}</div><div class="form-section">关键指标录入</div><p class="hint">请核对已签署协议，填写下方关键指标。一份协议对应一个产品。</p><div class="form-grid">${field('appName','授权应用名称',o.appName||'','text','required')}${field('allowedPurpose','协议约定用途',o.allowedPurpose||o.purpose||'','text','required')}${field('start','使用开始日期',o.start||o.requestedStart||TODAY(),'date','required')}${field('end','使用截止日期',o.end||o.requestedEnd||FUTURE(),'date','required')}${field('limit','授权调用总次数',o.limit??o.expectedCalls??10000,'number','required min="1" step="1"')}${field('negotiatedAmount','线下商定费用（元，选填）',o.negotiatedAmount??'','number','min="0" step="0.01"')}${area('feeNote','费用说明',o.feeNote||'')}${ptSelect('allowedEnvironment','授权环境',['生产环境','测试环境','测试与生产'],o.allowedEnvironment||o.expectedEnvironment||'生产环境')}${area('authorizationNote','授权说明',o.authorizationNote||'')}</div><div class="form-foot"><button class="btn primary">保存协议登记</button></div></form>`)}`}
function ptAgreements(){if(state.role!=='operator')return ptNotAllowed();const q=state.ptAgreementQuery||{},shown=state.orders.filter(o=>ptOperatesOrder(o)&&o.agreementId&&(!q.keyword||`${o.agreementId} ${o.company} ${product(o.productId)?.name}`.includes(q.keyword))&&(!q.status||o.status===q.status));return `${head('','协议管理','按协议管理关联产品、使用期限、次数、数据控制和授权状态。')}${panel('协议列表',`<form class="filters" data-form="pt-agreement-search">${field('keyword','协议 / 客户 / 产品',q.keyword||'')}${ptSelect('status','授权状态',[['','全部'],['authorization','待开通'],['active','生效中'],['suspended','已停用']],q.status||'')}<button class="btn primary">查询</button>${ptBtn('重置','reset-agreements','','','type="button"')}</form>${ptTable(['协议编号','使用方','产品','开始日期','截止日期','已用次数','总次数','授权状态','操作'],shown.map(o=>`<tr><td class="mono">${esc(o.agreementId)}</td><td>${esc(o.company)}</td><td>${esc(product(o.productId)?.name||o.productId)}</td><td>${esc(o.start)}</td><td>${esc(o.end)}</td><td>${Number(o.used||0).toLocaleString()}</td><td>${Number(o.limit||0).toLocaleString()}</td><td>${orderLabel(o.status)}</td><td>${ptBtn('查看详情','order-detail',o.id,'small primary','data-source="agreements"')}${ptBtn('数据控制','agreement-data',o.id,'small')}</td></tr>`))}`)}`}
function ptAgreementDetail(o){if(!maCanOperateOrder(o))return ptNotAllowed();const p=product(o.productId),tab=state.ptAgreementTab||'agreement';const body=tab==='usage'?maAgreementUsage(o):tab==='data'?ptAgreementScopeView(o)+ptDataControls(o,p):tab==='calls'?maAgreementCalls(o):tab==='history'?maAgreementHistory(o):ptAuthorizationView(o)+`<div class="form-foot">${ptBtn('修改协议','edit-agreement',o.id)}${!o.identityChangeHold&&o.status==='authorization'?ptBtn('开通授权','authorize',o.id,'primary'):''}${!o.identityChangeHold&&o.status==='suspended'?ptBtn('恢复授权','authorize',o.id,'primary'):''}${o.status==='active'?ptBtn('暂停授权','suspend',o.id,'danger'):''}</div>`;return `${head('','协议详情',`${esc(o.agreementId)} · ${esc(p?.name||o.productId)}`,ptBtn('返回协议列表','back-agreements'))}${panel('协议与授权',`${ptTabs([['agreement','协议与授权'],['usage','用量与 IP'],['data','数据开放范围'],['calls','调用记录'],['history','变更记录']],tab,'agreement-tab',o.id)}${body}`)}`}
function ptDataControls(o,p){const fields=ptSchemaFor(p),allowed=o.allowedDataFields||fields.filter(s=>!s.groupId||o.openFields?.includes(s.groupId)).map(s=>s.name);return `<form data-form="pt-data-rules"><input type="hidden" name="orderId" value="${esc(o.id)}"><div class="form-section">开放字段</div><div class="check-grid">${fields.map(s=>`<label class="check-card"><input type="checkbox" name="allowedDataFields" value="${esc(s.name)}" ${allowed.includes(s.name)?'checked':''}><span><b>${esc(s.label)}</b><small>${esc(s.name)}</small></span></label>`).join('')}</div><div class="form-section">字段值与字典值限制</div><p class="hint">仅开放指定值：只返回与所选值匹配的记录；禁止指定值：过滤与所选值匹配的记录。未启用限制的字段按开放字段返回。</p>${ptTable(['字段名称','字段标识','限制类型','启用','规则','规则值'],(p.controlDefinitions||[]).map((d,i)=>{const s=fields.find(x=>x.name===d.field);if(!s)return '';const rule=o.dataRules?.find(r=>r.field===d.field);return `<tr data-rule-row data-field="${esc(d.field)}" data-type="${esc(d.type)}"><td><b>${esc(s.label)}</b></td><td class="mono">${esc(s.name)}</td><td>${d.type==='dictionary'?'字典值限制':'字段值限制'}</td><td><input type="checkbox" aria-label="启用 ${esc(s.name)} 限制" data-rule-enabled ${rule?'checked':''}></td><td><select data-rule-mode aria-label="${esc(s.name)} 规则"><option value="allow" ${rule?.mode!=='deny'?'selected':''}>仅开放指定值</option><option value="deny" ${rule?.mode==='deny'?'selected':''}>禁止指定值</option></select></td><td>${d.type==='dictionary'?`<select multiple size="${Math.max(2,Math.min(5,s.dictionaryValues.length))}" data-rule-values aria-label="${esc(s.name)} 字典值" style="min-width:170px">${s.dictionaryValues.map(v=>`<option value="${esc(v)}" ${rule?.values?.map(String).includes(String(v))?'selected':''}>${esc(v)}</option>`).join('')}</select>`:`<input data-rule-values aria-label="${esc(s.name)} 限制值" value="${esc(rule?.values?.join(',')||'')}" placeholder="多个值用逗号分隔" style="width:220px">`}</td></tr>`}))}${area('reason','配置变更原因','','required')}<div class="form-foot"><button class="btn primary" ${o.identityChangeHold?'disabled':''}>保存数据控制</button></div></form>`}
async function ptDownloadSdk(o){if(state.role!=='customer'||!ownedOrders().some(x=>x.id===o?.id)||!o.agreementId||o.identityChangeHold||!['authorization','active','suspended'].includes(o.status)){toast('协议登记后可下载 SDK');return}const p=product(o.productId);if(p?.sdkRef){await ptDownloadAttachment(p.sdkRef,p.sdkFile);return}const text=`/** 数据资产服务平台 JavaScript 示例 SDK：仅用于原型演示。\n * 使用占位服务地址与凭证，不能调用真实业务接口。\n * 产品 ${p?.id}；协议 ${o.agreementId}。服务端负责执行身份、IP、额度和数据规则校验。\n */\nexport function createDataClient({endpoint='https://api.example.invalid',credential='YOUR_SERVER_ISSUED_TOKEN'}={}) {\n  return { async query(request) {\n    if (endpoint.includes('example.invalid')) throw new Error('示例 SDK，请替换正式服务地址与服务端签发的凭证');\n    const response=await fetch(endpoint+'${p?.endpoint||'/v1/query'}',{method:'${p?.method||'POST'}',headers:{'Content-Type':'application/json','Authorization':'Bearer '+credential},body:JSON.stringify(request)});\n    if(!response.ok) throw new Error('API '+response.status);return response.json();\n  }};\n}\n`;ptDownloadBlob(new Blob([text],{type:'text/javascript;charset=utf-8'}),'数据资产服务平台_SDK示例.js');toast('已下载明确标注的示例 SDK')}
function ptDownloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function ptDownloadAttachment(ref,name){const item=await loadAttachment(ref);if(!item||item.demo){toast('历史示例资料未包含实际文件，请重新上传');return}ptDownloadBlob(item.blob,name||item.name)}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-action]');if(!b||!b.dataset.action.startsWith('pt-'))return;if(b.dataset.action==='pt-preview-upload'){ptCaptureProductForm();return}e.preventDefault();e.stopImmediatePropagation();const a=b.dataset.action.slice(3),oid=b.dataset.id;
  const operatorActions=['new-product','edit-product','submit-product','reset-products','review-product','back-reviews','review-tab','reset-reviews','add-schema','remove-schema','add-definition','remove-definition','schema-template','order-detail','order-tab','back-orders','reset-orders','edit-agreement','back-agreement-form','reset-agreements','agreement-data','agreement-tab','back-agreements','authorize','suspend'];if(operatorActions.includes(a)&&!ptOperator())return;
  if(a==='new-product'){state.editProduct=null;ptDraft=ptNewDraft();ptPendingFiles={};setRoute('product-form');return}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-action]');if(!b)return;
  const action=b.dataset.action;
  if(action==='pt-preview-upload') {
    e.preventDefault();e.stopImmediatePropagation();
    const kind=b.dataset.kind,p=ptDraft||{},file=ptPendingFiles[kind];
    if(file){await shellShowFile(file,file.name);return;}
    const ref=p[kind+'Ref'],name=p[kind==='apiDocument'?'apiDocumentFile':kind+'File'];
    if(!ref){toast('请先选择需要预览的文件');return;}
    const record=await loadAttachment(ref);
    if(!record?.blob){toast('该历史附件未保存实际文件内容');return;}
    await shellShowFile(record.blob,name);return;
  }
  if(action==='shell-preview-file') {
    e.preventDefault();e.stopImmediatePropagation();
    const file=b.closest('form')?.querySelector(`[name="${CSS.escape(b.dataset.field)}"]`)?.files?.[0];
    if(!file){toast('请先选择需要预览的文件');return;}
    await shellShowFile(file,file.name);return;
  }
  if(action==='shell-preview-document'||(action==='view-attachment'&&!b.dataset.ref?.startsWith('demo-'))) {
    e.preventDefault();e.stopImmediatePropagation();
    const record=await loadAttachment(b.dataset.ref);
    if(!record?.blob){toast('该历史附件未保存实际文件内容');return;}
    await shellShowFile(record.blob,b.dataset.name);return;
  }
  if(['open-role-cert','edit-role-cert'].includes(action)&&b.dataset.roleKey!=='consumer') {e.preventDefault();e.stopImmediatePropagation();toast('一期仅开放使用方认证');return;}
  const protectedActions=['open-cert-review','cert-approve','cert-return','new-product','edit-product','product-approve','product-return','open-product-review','accept-order','reject-order','edit-agreement','activate-order','suspend-order','resume-order'];
  if(protectedActions.includes(action)&&state.role!=='operator'){e.preventDefault();e.stopImmediatePropagation();toast('当前账号无权执行该操作');return;}
  if(action==='shell-cert-reset'){e.preventDefault();e.stopImmediatePropagation();Object.assign(state.shell,{certQuery:'',certType:'all',certStatus:'all'});render();return;}
  if(action==='shell-message-filter'){e.preventDefault();e.stopImmediatePropagation();state.shell.messageType=b.dataset.type;render();return;}
  if(action==='reset') {
    e.preventDefault();e.stopImmediatePropagation();
    if(confirm('重置全部本地演示数据和操作记录？')){state=seed();normalizeCertificationApplications(state);if(typeof ptInitialize==='function')ptInitialize();if(typeof maInitialize==='function')maInitialize();shellInitialize();render();toast('已恢复初始演示数据');}
  }
},true);

    });
    let actions=[...form.children].find(el=>el.classList.contains('ma-table-actions'));
    if(!actions){actions=document.createElement('div');[...form.children].filter(el=>el.tagName==='BUTTON').forEach(el=>actions.appendChild(el));form.appendChild(actions);}
    actions.classList.add('ui-query-actions');
    const occupied=fields.length+(fields.length<=2&&fields.some(el=>el.classList.contains('ui-query-keyword'))?1:0);
    actions.style.setProperty('--ui-actions-span',String(4-(occupied%4)));
    const result=form.closest('section.panel');if(!result)return;
    const hasResults=!!result.querySelector('.table-wrap,.catalog-list');
    if(hasResults){
      result.classList.add('ui-result-panel');
      const query=document.createElement('section');query.className='panel ui-query-panel';query.setAttribute('aria-label','查询条件');
      const pad=document.createElement('div');pad.className='panel-pad';pad.appendChild(form);query.appendChild(pad);result.before(query);
      const existingPad=[...result.children].find(el=>el.classList.contains('panel-pad'));
      if(existingPad&&!existingPad.children.length)existingPad.remove();
      if(!result.querySelector('.panel-title')){
        const heading=document.createElement('div');heading.className='panel-pad';
        const title=document.createElement('div');title.className='panel-title';
        const h2=document.createElement('h2');h2.textContent=titles[state.route]||'查询结果';title.appendChild(h2);heading.appendChild(title);result.prepend(heading);
      }
    }else{
      result.classList.add('ui-query-panel');result.setAttribute('aria-label','查询条件');
      const title=result.querySelector('.panel-title');if(title?.textContent.trim()==='查询条件')title.remove();
      const next=result.nextElementSibling;if(next?.classList.contains('panel'))next.classList.add('ui-result-panel');
    }
  });
  csEnhance();
}

  ptInitialize();
  maInitialize();
  shellInitialize();
  layoutInitialize();
  csInitialize();
  simulate=maSimulate;
  render();
})();
</script>
</body>
</html>
